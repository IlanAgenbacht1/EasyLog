<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EasyLog Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- App Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth-service.js"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
        <div class="bg-white rounded-lg shadow-lg p-8">
            <!-- Logo -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-blue-600">EasyLog</h1>
                <p class="text-gray-500 mt-1">Admin Portal</p>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="hidden bg-red-50 text-red-600 px-4 py-3 rounded-lg text-sm mb-6 whitespace-pre-line">
            </div>

            <!-- Google Sign-in Button -->
            <button
                id="googleSignInBtn"
                class="w-full bg-white border border-gray-300 text-gray-700 py-3 px-4 rounded-lg font-medium hover:bg-gray-50 transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center"
            >
                <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                <span id="signInBtnText">Sign in with Google</span>
            </button>

            <p class="text-xs text-gray-500 text-center mt-6">
                Only authorized portal admins can access this system
            </p>
        </div>
    </div>

    <script>
        // Check if already logged in
        authService.redirectIfLoggedIn();

        // Google Sign-in handler
        document.getElementById('googleSignInBtn').addEventListener('click', async () => {
            const button = document.getElementById('googleSignInBtn');
            const buttonText = document.getElementById('signInBtnText');
            const errorMessage = document.getElementById('errorMessage');

            // Reset error
            errorMessage.classList.add('hidden');

            // Disable button
            button.disabled = true;
            buttonText.textContent = 'Signing in...';

            try {
                await authService.signInWithGoogle();
                // Redirect to dashboard
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = error.message || 'Sign-in failed. Please try again.';
                errorMessage.classList.remove('hidden');
                button.disabled = false;
                buttonText.textContent = 'Sign in with Google';
            }
        });
    </script>
</body>
</html>
