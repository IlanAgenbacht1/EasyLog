<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineers - EasyLog Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- App Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth-service.js"></script>
    <script src="js/firestore-service.js"></script>
    <script src="js/utils.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center h-16">
                <div class="flex-1 flex items-center">
                    <span class="text-xl font-bold text-blue-600">EasyLog</span>
                </div>
                <div class="flex-1 flex items-center justify-center space-x-1">
                    <a href="index.html" class="text-gray-600 hover:text-gray-900 hover:bg-gray-50 px-3 py-2 rounded-md text-sm font-medium whitespace-nowrap transition">Dashboard</a>
                    <a href="timelogs.html" class="text-gray-600 hover:text-gray-900 hover:bg-gray-50 px-3 py-2 rounded-md text-sm font-medium whitespace-nowrap transition">Time Logs</a>
                    <a href="engineers.html" class="text-blue-600 bg-blue-50 px-3 py-2 rounded-md text-sm font-medium whitespace-nowrap">Engineers</a>
                    <a href="customers.html" class="text-gray-600 hover:text-gray-900 hover:bg-gray-50 px-3 py-2 rounded-md text-sm font-medium whitespace-nowrap transition">Customers</a>
                    <a href="reports.html" class="text-gray-600 hover:text-gray-900 hover:bg-gray-50 px-3 py-2 rounded-md text-sm font-medium whitespace-nowrap transition">Reports</a>
                </div>
                <div class="flex-1 flex items-center justify-end space-x-3">
                    <div class="text-sm text-right">
                        <div id="userName" class="font-medium text-gray-900">Loading...</div>
                        <div class="text-xs text-gray-500">Portal Admin</div>
                    </div>
                    <button onclick="handleLogout()" class="px-3 py-1.5 text-sm font-medium text-red-600 hover:text-white hover:bg-red-600 border border-red-600 rounded-md transition">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Engineers</h1>
                <p class="text-gray-600">Manage engineer accounts and access</p>
            </div>
            <button onclick="openAddModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                </svg>
                Add Engineer
            </button>
        </div>

        <!-- Filter -->
        <div class="bg-white rounded-lg shadow-sm p-4 mb-6">
            <div class="flex items-center space-x-4">
                <div class="flex-1">
                    <input type="text" id="searchInput" placeholder="Search engineers..."
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        oninput="filterEngineers()">
                </div>
                <div>
                    <select id="statusFilter" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" onchange="filterEngineers()">
                        <option value="all">All Status</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Engineers Table -->
        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Engineer</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Contact</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody id="engineersTable" class="bg-white divide-y divide-gray-200">
                    <!-- Populated by JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Add/Edit Engineer Modal -->
    <div id="engineerModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
            <div class="px-6 py-4 border-b">
                <h3 id="modalTitle" class="text-lg font-semibold text-gray-900">Add Engineer</h3>
            </div>
            <form id="engineerForm" onsubmit="handleSaveEngineer(event)">
                <div class="px-6 py-4 space-y-4">
                    <input type="hidden" id="engineerId">

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                        <input type="text" id="engineerName" required
                            class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" id="engineerEmail" required
                            class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                        <input type="tel" id="engineerPhone"
                            class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>

                    <div id="statusSection" class="hidden">
                        <label class="flex items-center">
                            <input type="checkbox" id="engineerActive" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <span class="ml-2 text-sm text-gray-700">Active (can use app)</span>
                        </label>
                    </div>
                </div>

                <div class="px-6 py-4 border-t bg-gray-50 flex justify-end space-x-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-gray-700 hover:text-gray-900 transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allEngineers = [];

        // Check auth on load
        (async function initializeEngineers() {
            const isAuthed = await authService.requireAuth();
            if (!isAuthed) return;

            // Set user name
            const adminInfo = await authService.getCurrentAdminInfo();
            if (adminInfo) {
                document.getElementById('userName').textContent = adminInfo.name || adminInfo.email;
            }

            await loadEngineers();
        })();

        // Load engineers
        async function loadEngineers() {
            const tbody = document.getElementById('engineersTable');
            const container = tbody.closest('.bg-white');
            utils.showLoading(container);

            try {
                const engineers = await firestoreService.engineers.list();
                allEngineers = engineers;
                renderEngineers(engineers);
            } catch (error) {
                utils.showError(container, 'Failed to load engineers');
                utils.showToast(error.message, 'error');
            }
        }

        function renderEngineers(engineers) {
            let tbody = document.getElementById('engineersTable');

            // If tbody doesn't exist (was replaced by loading spinner), recreate table structure
            if (!tbody) {
                const container = document.querySelector('.bg-white.rounded-lg.shadow-sm.overflow-hidden');
                container.innerHTML = `
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Engineer</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Contact</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="engineersTable" class="bg-white divide-y divide-gray-200">
                        </tbody>
                    </table>
                `;
                tbody = document.getElementById('engineersTable');
            }

            if (engineers.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="px-6 py-12 text-center text-gray-500">
                            No engineers found
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = engineers.map(engineer => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4">
                        <div class="flex items-center">
                            <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center">
                                <span class="text-blue-600 font-medium">${getInitials(engineer.name)}</span>
                            </div>
                            <div class="ml-3">
                                <p class="font-medium text-gray-900">${utils.escapeHtml(engineer.name)}</p>
                                <p class="text-sm text-gray-500">ID: ${engineer.id}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <p class="text-gray-900">${utils.escapeHtml(engineer.email || '-')}</p>
                        <p class="text-sm text-gray-500">${utils.escapeHtml(engineer.phone || '-')}</p>
                    </td>
                    <td class="px-6 py-4">
                        ${engineer.isActive !== false
                            ? '<span class="px-2 py-1 text-xs font-medium rounded-full bg-green-100 text-green-800">Active</span>'
                            : '<span class="px-2 py-1 text-xs font-medium rounded-full bg-gray-100 text-gray-800">Inactive</span>'
                        }
                    </td>
                    <td class="px-6 py-4 text-gray-500">
                        ${utils.formatDate(engineer.createdAt)}
                    </td>
                    <td class="px-6 py-4 text-right">
                        <div class="flex justify-end space-x-2">
                            <button onclick="openEditModal('${engineer.id}')"
                                class="text-blue-600 hover:text-blue-800 p-1 transition" title="Edit">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                                </svg>
                            </button>
                            <button onclick="toggleEngineerStatus('${engineer.id}', ${engineer.isActive !== false})"
                                class="${engineer.isActive !== false ? 'text-red-600 hover:text-red-800' : 'text-green-600 hover:text-green-800'} p-1 transition"
                                title="${engineer.isActive !== false ? 'Deactivate' : 'Activate'}">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    ${engineer.isActive !== false
                                        ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path>'
                                        : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>'
                                    }
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function getInitials(name) {
            if (!name) return '?';
            return name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
        }

        function filterEngineers() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;

            const filtered = allEngineers.filter(engineer => {
                const matchesSearch = engineer.name.toLowerCase().includes(search) ||
                    (engineer.email && engineer.email.toLowerCase().includes(search));

                const matchesStatus = status === 'all' ||
                    (status === 'active' && engineer.isActive !== false) ||
                    (status === 'inactive' && engineer.isActive === false);

                return matchesSearch && matchesStatus;
            });

            renderEngineers(filtered);
        }

        // Modal functions
        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Add Engineer';
            document.getElementById('engineerForm').reset();
            document.getElementById('engineerId').value = '';
            document.getElementById('statusSection').classList.add('hidden');
            document.getElementById('engineerModal').classList.remove('hidden');
            document.getElementById('engineerModal').classList.add('flex');
        }

        function openEditModal(id) {
            const engineer = allEngineers.find(e => e.id === id);
            if (!engineer) return;

            document.getElementById('modalTitle').textContent = 'Edit Engineer';
            document.getElementById('engineerId').value = engineer.id;
            document.getElementById('engineerName').value = engineer.name;
            document.getElementById('engineerEmail').value = engineer.email || '';
            document.getElementById('engineerPhone').value = engineer.phone || '';
            document.getElementById('engineerActive').checked = engineer.isActive !== false;
            document.getElementById('statusSection').classList.remove('hidden');
            document.getElementById('engineerModal').classList.remove('hidden');
            document.getElementById('engineerModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('engineerModal').classList.add('hidden');
            document.getElementById('engineerModal').classList.remove('flex');
        }

        async function handleSaveEngineer(event) {
            event.preventDefault();

            const id = document.getElementById('engineerId').value;
            const data = {
                name: document.getElementById('engineerName').value,
                email: document.getElementById('engineerEmail').value,
                phone: document.getElementById('engineerPhone').value || null
            };

            if (id) {
                data.isActive = document.getElementById('engineerActive').checked;
            }

            try {
                if (id) {
                    await firestoreService.engineers.update(id, data);
                    utils.showToast('Engineer updated successfully', 'success');
                } else {
                    await firestoreService.engineers.create(data);
                    utils.showToast('Engineer created successfully', 'success');
                }
                closeModal();
                loadEngineers();
            } catch (error) {
                utils.showToast(error.message, 'error');
            }
        }

        async function toggleEngineerStatus(id, currentlyActive) {
            const action = currentlyActive ? 'deactivate' : 'activate';
            if (!confirm(`Are you sure you want to ${action} this engineer?`)) return;

            try {
                await firestoreService.engineers.toggleActive(id, !currentlyActive);
                utils.showToast(`Engineer ${action}d successfully`, 'success');
                loadEngineers();
            } catch (error) {
                utils.showToast(error.message, 'error');
            }
        }

        async function handleLogout() {
            try {
                await authService.signOut();
                window.location.href = 'login.html';
            } catch (error) {
                utils.showToast('Failed to log out', 'error');
            }
        }

    </script>
</body>
</html>
